name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      # Testcontainers starts PostgreSQL 16 with the runner's Docker: tests hit a real database.
      - name: Pytest
        run: pytest -q

  # The deploy job (OIDC login to Azure, Container Apps) is added in Phase 10,
  # once the Azure resources exist.

  # Publishes the API image to GitHub Container Registry, only from main and only after the
  # tests pass, so the registry never holds an image CI rejected. Azure Container Apps pulls
  # it from there (free for public images; Azure Container Registry would bill ~USD 5/month).
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tagged by commit, so a deployment names exactly what it runs; `latest` for humans.
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
